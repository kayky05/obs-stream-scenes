<!doctype html>
<html lang="{{LANG}}">
<head>
<meta charset="utf-8">
<title>{{TITLE}}</title>
<!--
  One layer of one OBS scene, loaded as a Browser Source > Local file.
  Generated by obs-stream-scenes/scripts/build_kit.py from studio.json: edit studio.json or the kit's
  theme/ folder and rebuild, never this file (the next build overwrites it).

  This file only places things: WHERE each frame, text and panel goes comes from the scene preset.
  HOW they look (type, borders, shadows, background, motion) comes from ../theme/theme.css and
  ../theme/theme.js, written for this client after studying the brand.

  Texts are re-read from ../text/<key>.txt every 2 s. ?anim=0 freezes motion (preview.py uses it).
-->
<style>
{{FONT_FACES}}

  :root {
    /* brand tokens from studio.json; theme.css builds on these */
    --bg: {{C_BG}}; --text: {{C_TEXT}}; --accent: {{C_ACCENT}}; --accent-2: {{C_ACCENT2}};
    --bg-rgb: {{C_BG_RGB}}; --text-rgb: {{C_TEXT_RGB}}; --accent-rgb: {{C_ACCENT_RGB}}; --accent-2-rgb: {{C_ACCENT2_RGB}};
    --font-sans: "Brand Sans", system-ui, sans-serif;
    --font-display: "Brand Display", var(--font-sans);
    --font-mono: "Brand Mono", ui-monospace, monospace;
    --cw: {{CW}}px; --ch: {{CH}}px;
    --frame-pad: 10px;   /* how far a frame reaches outside the captured box; themes may change it */
    --live: #ff3b3b;
  }

  /* structural defaults only: neutral, so a missing theme rule never breaks a scene */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: var(--cw); height: var(--ch); overflow: hidden; background: {{BODY_BG}}; }
  #stage { position: relative; width: var(--cw); height: var(--ch); overflow: hidden; font-family: var(--font-sans); color: var(--text); }
  .abs { position: absolute; }
  .backdrop { inset: 0; background: var(--bg); overflow: hidden; }
  .frame { border: 1px solid rgba(var(--accent-rgb), .5); }
  .panel { background: rgba(var(--bg-rgb), .6); }
  .brand.center { text-align: center; }
  .brand .logo { display: block; height: auto; max-width: 100%; }
  .brand.center .logo { margin: 0 auto; }
  .t { overflow: hidden; display: -webkit-box; -webkit-box-orient: vertical; }
  .t.label { display: block; white-space: pre; }
  .foot { display: flex; justify-content: space-between; align-items: center; }
  .pill, .badge { display: flex; align-items: center; }
  .pill .ptext { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pill .ptext:empty { display: none; }
  .countdown { font-variant-numeric: tabular-nums; }
</style>
<link rel="stylesheet" href="../theme/theme.css">
<script src="../theme/theme.js"></script>
</head>
<body>
<div id="stage"></div>
<script>
  const DATA = {{DATA_JSON}};
  const frozen = new URLSearchParams(location.search).get('anim') === '0';
  const THEME = window.THEME || {};
  const stage = document.getElementById('stage');
  document.body.classList.toggle('frozen', frozen);
  document.body.dataset.layer = DATA.layer;
  document.body.dataset.scene = DATA.scene;
  const [CW, CH] = DATA.canvas;
  const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
  const pad = () => parseFloat(css('--frame-pad')) || 0;

  const el = (tag, cls, style = {}, html) => {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    Object.assign(n.style, style);
    if (html !== undefined) n.innerHTML = html;
    return n;
  };
  const px = (v) => `${v}px`;
  const box = ([x, y, w, h], p = 0) => ({ left: px(x - p), top: px(y - p), width: px(w + 2 * p), height: px(h + 2 * p) });
  const at = (e) => ({ left: px(e.x), top: px(e.y), width: e.w ? px(e.w) : 'auto', textAlign: e.align || 'left' });
  const anchor = (a, inset = 40) => {
    const s = {};
    s[a.includes('top') ? 'top' : 'bottom'] = px(inset);
    s[a.includes('left') ? 'left' : 'right'] = px(inset);
    return s;
  };
  const esc = (t) => String(t ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const textNodes = {};
  const bindText = (key, node) => { (textNodes[key] ||= []).push(node); node.textContent = DATA.texts[key] ?? ''; };
  const ctx = { canvas: DATA.canvas, frozen, css, data: DATA, stage };
  const add = (node, e) => { node.dataset.type = e.type; stage.appendChild(node); THEME.decorate?.(node, e, ctx); return node; };

  const draw = {
    backdrop(e) {
      const b = add(el('div', 'abs backdrop'), e);
      THEME.backdrop?.(b, e, ctx);   // the theme paints the background and its motion
    },
    frame(e) { add(el('div', 'abs frame', box(e.rect, pad())), e); },
    panel(e) { add(el('div', 'abs panel', box(e.rect, 0)), e); },
    rule(e) { add(el('div', 'abs rule', { left: px(e.x), top: px(e.y), width: px(e.w) }), e); },
    brand(e) {
      const B = DATA.brand, size = e.size || 'lg';
      const n = el('div', `abs brand ${size} ${e.align === 'center' ? 'center' : ''}`, at(e));
      const scale = { lg: 1, md: .72, sm: .5 }[size];
      n.innerHTML = (B.logo
        ? `<img class="logo" src="${esc(B.logo)}" alt="${esc(B.name)}" style="width:${Math.round(B.logo_width * scale)}px">`
        : `<div class="wordmark">${esc(B.name)}</div>`) +
        (B.eyebrow ? `<div class="eyebrow">${esc(B.eyebrow)}</div>` : '') +
        (B.product && size !== 'sm' ? `<div class="product">${esc(B.product)}</div>` : '') +
        (B.tagline && size === 'lg' ? `<div class="sub">${B.tagline.split('\n').map(esc).join('<br>')}</div>` : '');
      add(n, e);
    },
    text(e) {
      const n = el('div', `abs t ${e.style || 'title'}`, { ...at(e), WebkitLineClamp: e.lines || 2 });
      n.dataset.key = e.key;
      bindText(e.key, n);
      add(n, e);
    },
    foot(e) {
      add(el('div', 'abs foot', { left: px(e.x), top: px(e.y), width: px(e.w) },
        `<span class="foot-label"><span class="dot"></span>${esc(DATA.brand.footer_label)}</span><span class="foot-site">${esc(DATA.brand.site)}</span>`), e);
    },
    socials(e) {
      if (!DATA.socials.length) return;
      add(el('div', 'abs socials', at(e), DATA.socials.map((s) => `<span class="social">${esc(s)}</span>`).join('<span class="sep"></span>')), e);
    },
    pill(e) {
      const n = el('div', `abs pill ${e.anchor || 'bottom-left'}`, { ...anchor(e.anchor || 'bottom-left'), maxWidth: px(CW - 400) });
      n.innerHTML = `<span class="dot"></span><span class="label">${esc(DATA.brand.footer_label)}</span>`;
      if (e.key) { const t = el('span', 'ptext'); bindText(e.key, t); n.appendChild(t); }
      add(n, e);
    },
    badge(e) {
      const pos = e.anchor ? anchor(e.anchor) : { left: px(e.x), top: px(e.y) };
      add(el('div', 'abs badge', pos, `<i></i><span>${esc(DATA.strings.live)}</span>`), e);
    },
    countdown(e) {
      const n = add(el('div', 'abs countdown', at(e)), e);
      const total = e.minutes * 60, t0 = Date.now();
      const show = () => {
        const left = frozen ? total : Math.max(0, total - Math.floor((Date.now() - t0) / 1000));
        n.textContent = left > 0 ? `${String(Math.floor(left / 60)).padStart(2, '0')}:${String(left % 60).padStart(2, '0')}` : DATA.strings.soon;
        n.classList.toggle('done', left === 0);
      };
      show();
      if (!frozen) setInterval(show, 250);
    },
  };

  for (const e of DATA.elements) {
    if (draw[e.type]) draw[e.type](e);
    else if (THEME.elements?.[e.type]) add(THEME.elements[e.type](e, ctx), e);   // custom element types from the theme
    else console.warn('unknown element', e.type);
  }
  THEME.after?.(stage, ctx);

  const refresh = async (key) => {
    try {
      const res = await fetch(`../text/${encodeURIComponent(key)}.txt?t=${Date.now()}`, { cache: 'no-store' });
      if (!res.ok) return;
      const text = (await res.text()).replace(/^﻿/, '').trim().split(/\r?\n/)[0] || '';
      for (const n of textNodes[key]) if (n.textContent !== text) { n.textContent = text; THEME.textChanged?.(n, key, ctx); }
    } catch { /* keeps the text baked in at build time */ }
  };
  if (!frozen) {
    const keys = Object.keys(textNodes);
    const all = () => keys.forEach(refresh);
    all();
    setInterval(all, 2000);
  }
</script>
</body>
</html>
